name: Gerar cobrinha de contribuições

on:
  schedule:
    # todo dia às 03:00 UTC (00:00 em Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C05A24&color_dots=#161B22,#1E3A52,#2E5A80,#4A7FA5,#6E9BC7
            dist/github-snake-light.svg?color_snake=#C05A24&color_dots=#EBEDF0,#C6D8E8,#94B5D1,#5B84AD,#2E5A80

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
